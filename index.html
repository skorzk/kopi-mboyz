<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6f4e37">
<title>Kopi Mboyz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Isi halaman digambar oleh app.js ke elemen ini -->
<div id="app"></div>

<!-- Menu bawah: data-t = kode tab -->
<nav id="nav"><button data-t="h">Hari ini</button><button data-t="m">Menu</button><button data-t="r">Riwayat</button></nav>

<!-- Popup Edit: nama, lokasi, shift -->
<div id="pf" class="mo"><div class="c"><h2>Data penjual</h2>
<label class="l" for="pn">Nama</label><input id="pn" placeholder="Nama kamu">
<label class="l" for="pl">Lokasi</label><input id="pl" placeholder="Lokasi jualan">
<label class="l" for="ps">Shift</label><input id="ps" placeholder="Waktu jualan">
<div class="r" style="margin-top:14px"><button class="g" style="flex:1;color:var(--tx)" data-a="profx">Batal</button><button style="flex:1" data-a="profok">Simpan</button></div></div></div>

<!-- Layar penuh untuk melihat foto bukti QRIS -->
<div id="ov" data-a="close"><img id="ovi" alt="Bukti"></div>

<!-- Logika aplikasi -->
<script src="app.js"></script>
</body>
</html>
