<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6f4e37">
<title>Kasir Kopi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b1d14;--mut:#7a6a5e;--ac:#6f4e37;--acx:#fff;--bd:#e6dcd2;--ok:#1d7a3e;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#2a201a;--tx:#f3e9df;--mut:#b5a597;--ac:#d1a47c;--acx:#1b1410;--bd:#41342b;--ok:#6fd08c;--bad:#ff8a80;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:12px 12px 84px}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.r{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{text-align:right}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--acx);cursor:pointer}
button.g{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.q{width:42px;height:42px;font-size:22px;padding:0}
.n{font-size:22px;min-width:40px;text-align:center;font-weight:700}
.big{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tot{border-top:1px dashed var(--bd);margin-top:8px;padding-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}
nav button.on{color:var(--ac);font-weight:700}
.th{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
#ov img{max-width:96%;max-height:92%}
.w{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><button data-t="h">Hari ini</button><button data-t="m">Menu</button><button data-t="r">Riwayat</button></nav>
<div id="ov" data-a="close"><img id="ovi" alt="Bukti"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>'Rp '+(Math.round(n)||0).toLocaleString('id-ID');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S={menu:[{id:'m1',name:'Kopsu',price:10000},{id:'m2',name:'Basic',price:12000}],days:{}},cur=today(),tab='h';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('kasirkopi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}}

function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.src=u})}

const D=(k=cur)=>S.days[k]||(S.days[k]={cups:0,sales:{},pays:[]});
function calc(d){let sold=0,exp=0;for(const k in d.sales){sold+=d.sales[k].q;exp+=d.sales[k].q*d.sales[k].p}
const qris=d.pays.reduce((a,p)=>a+(+p.amt||0),0);return{sold,exp,qris,sisa:d.cups-sold,tunai:exp-qris}}

function viewH(){
const d=D(),t=calc(d);
const rows=S.menu.map(m=>({id:m.id,n:m.name,p:m.price}));
for(const k in d.sales)if(!S.menu.find(m=>m.id===k))rows.push({id:k,n:d.sales[k].n+' (dihapus)',p:d.sales[k].p});
return `<h1>☕ Kasir Kopi</h1>
<div class="c"><input type="date" value="${cur}" data-c="date"></div>
<div class="c"><h2>Cup</h2>
<div class="r"><span>Cup dibawa</span><input type="number" inputmode="numeric" min="0" style="width:110px" value="${d.cups||''}" placeholder="0" data-c="cups"></div>
<div class="r"><span>Cup terjual</span><b>${t.sold}</b></div>
<div class="r tot"><span>Sisa cup (dibawa pulang)</span><span class="big ${t.sisa<0?'bad':''}">${t.sisa}</span></div>
${t.sisa<0?'<div class="bad mut">Terjual lebih banyak dari cup yang dibawa, cek lagi.</div>':''}</div>
<div class="c"><h2>Kopi terjual</h2>
${rows.map(r=>{const q=d.sales[r.id]?.q||0;return `<div class="r"><div><b>${r.n}</b><div class="mut">${fmt(r.p)}</div></div>
<div class="r" style="margin:0"><button class="q" data-a="dec" data-id="${r.id}">−</button><span class="n">${q}</span><button class="q" data-a="inc" data-id="${r.id}">+</button></div></div>`}).join('')||'<div class="mut">Belum ada menu. Tambah di tab Menu.</div>'}
</div>
<div class="c"><h2>Bukti QRIS</h2>
${d.pays.map(p=>`<div class="r"><img class="th" src="${p.img}" data-a="view" data-id="${p.id}" alt="Bukti">
<div style="flex:1"><input type="number" inputmode="numeric" placeholder="Nominal" value="${p.amt||''}" data-c="pamt" data-id="${p.id}"><input placeholder="Catatan" value="${p.note||''}" data-c="pnote" data-id="${p.id}" style="margin-top:6px"></div>
<button class="g" data-a="delpay" data-id="${p.id}">Hapus</button></div>`).join('')}
<label><input type="file" accept="image/*" data-c="file" style="display:none"><div class="r"><button style="width:100%" data-a="pick">+ Tambah screenshot bukti</button></div></label></div>
<div class="c"><h2>Hitungan uang</h2>
<div class="r"><span>Seharusnya didapat</span><span class="big">${fmt(t.exp)}</span></div>
<div class="r"><span>Masuk lewat QRIS</span><b>${fmt(t.qris)}</b></div>
<div class="r tot"><span>Uang tunai yang harus ada</span><span class="big ${t.tunai<0?'bad':'ok'}">${fmt(t.tunai)}</span></div>
${t.tunai<0?'<div class="bad mut">Total QRIS lebih besar dari penjualan, cek nominal.</div>':''}</div>`}

function viewM(){return `<h1>Menu &amp; Harga</h1>
<div class="c">${S.menu.map(m=>`<div class="r"><input value="${m.name}" data-c="mname" data-id="${m.id}"><input type="number" inputmode="numeric" style="width:120px" value="${m.price}" data-c="mprice" data-id="${m.id}"><button class="g" data-a="delmenu" data-id="${m.id}">✕</button></div>`).join('')}</div>
<div class="c"><h2>Tambah menu</h2><div class="r"><input id="nn" placeholder="Nama"><input id="np" type="number" inputmode="numeric" placeholder="Harga" style="width:120px"></div><button data-a="addmenu" style="width:100%">Tambah</button></div>`}

function viewR0(){
const ks=Object.keys(S.days).filter(k=>{const d=S.days[k];return d.cups||d.pays.length||Object.keys(d.sales).length}).sort().reverse();
return `<h1>Riwayat</h1>${ks.map(k=>{const t=calc(S.days[k]);return `<div class="c"><div class="r"><b>${k}</b><button class="g" data-a="delday" data-id="${k}">Hapus</button></div>
<div class="mut">Terjual ${t.sold} · sisa cup ${t.sisa}</div><div class="r"><span>Total</span><b>${fmt(t.exp)}</b></div><div class="r"><span>QRIS / Tunai</span><span>${fmt(t.qris)} / ${fmt(t.tunai)}</span></div>
<button data-a="open" data-id="${k}" style="width:100%">Buka</button></div>`}).join('')||'<div class="c mut">Belum ada data.</div>'}`}

function viewR(){return viewR0()+`<div class="c"><h2>Cadangan data</h2><div class="mut" style="margin-bottom:8px">Data tersimpan di HP ini saja. Simpan cadangan secara berkala.</div>
<button style="width:100%;margin-bottom:8px" data-a="share">Bagikan cadangan</button>
<button style="width:100%;margin-bottom:8px" data-a="exp">Unduh file cadangan</button>
<button class="g" style="width:100%" data-a="impick">Pulihkan dari file cadangan</button>
<input type="file" id="imp" accept=".json,application/json" data-c="imp" style="display:none"></div>`}
async function backup(share){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const f=new File([blob],'cadangan-kasir-kopi-'+today()+'.json',{type:'application/json'});
if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Cadangan Kasir Kopi'});return}catch(e){if(e.name==='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
function render(){
const y=scrollY;$('#app').innerHTML=tab==='h'?viewH():tab==='m'?viewM():viewR();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));scrollTo(0,y)}

document.addEventListener('click',async e=>{
const t=e.target.closest('[data-t],[data-a]');if(!t)return;
if(t.dataset.t){tab=t.dataset.t;render();return}
const a=t.dataset.a,id=t.dataset.id,d=D();
if(a==='pick'){e.preventDefault();document.querySelector('input[type=file]').click();return}
if(a==='close'){$('#ov').style.display='none';return}
if(a==='share'||a==='exp'){backup(a==='share');return}
if(a==='impick'){$('#imp').click();return}
if(a==='view'){$('#ovi').src=d.pays.find(p=>p.id===id).img;$('#ov').style.display='flex';return}
if(a==='inc'||a==='dec'){const m=S.menu.find(x=>x.id===id);const s=d.sales[id]||(d.sales[id]={q:0,n:m?m.name:'?',p:m?m.price:0});
if(m){s.n=m.name;s.p=m.price}s.q=Math.max(0,s.q+(a==='inc'?1:-1));if(!s.q)delete d.sales[id]}
else if(a==='delpay'){if(!confirm('Hapus bukti ini?'))return;d.pays=d.pays.filter(p=>p.id!==id)}
else if(a==='addmenu'){const n=$('#nn').value.trim(),p=+$('#np').value;if(!n)return;S.menu.push({id:uid(),name:n,price:p||0})}
else if(a==='delmenu'){if(!confirm('Hapus menu ini? Data penjualan lama tetap tersimpan.'))return;S.menu=S.menu.filter(m=>m.id!==id)}
else if(a==='delday'){if(!confirm('Hapus data hari '+id+'?'))return;delete S.days[id]}
else if(a==='open'){cur=id;tab='h'}
save();render()});

document.addEventListener('change',async e=>{
const t=e.target,c=t.dataset.c,id=t.dataset.id;if(!c)return;const d=D();
if(c==='date'){cur=t.value||today()}
else if(c==='cups')d.cups=Math.max(0,+t.value||0);
else if(c==='pamt')d.pays.find(p=>p.id===id).amt=+t.value||0;
else if(c==='pnote')d.pays.find(p=>p.id===id).note=t.value;
else if(c==='mname')S.menu.find(m=>m.id===id).name=t.value.trim()||'Menu';
else if(c==='mprice')S.menu.find(m=>m.id===id).price=+t.value||0;
else if(c==='imp'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());if(!(o.menu&&o.days))alert('File cadangan tidak valid');else if(confirm('Ganti semua data sekarang dengan cadangan ini?'))S=o}catch(x){alert('File cadangan tidak valid')}t.value=''}
else if(c==='file'&&t.files[0]){const img=await shrink(t.files[0]);d.pays.push({id:uid(),img,amt:0,note:'',t:Date.now()})}
save();render()});

(async()=>{
const s=await load();if(s&&s.menu&&s.days)S=s;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render()})();
</script>
</body>
</html>
